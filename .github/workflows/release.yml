name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run release:build

      - name: Archive release bundle
        run: |
          cd release
          zip -r "video-forge-${RELEASE_TAG}.zip" video-forge
          tar -czf "video-forge-${RELEASE_TAG}.tar.gz" video-forge

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/video-forge-${{ env.RELEASE_TAG }}.zip
            release/video-forge-${{ env.RELEASE_TAG }}.tar.gz
