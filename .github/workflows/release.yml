name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-bundle:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run release:build

      - name: Archive release bundle
        run: |
          cd release
          zip -r "video-forge-${RELEASE_TAG}.zip" video-forge
          tar -czf "video-forge-${RELEASE_TAG}.tar.gz" video-forge

      - name: Upload web bundle artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: web-release-bundle
          path: |
            release/video-forge-${{ env.RELEASE_TAG }}.zip
            release/video-forge-${{ env.RELEASE_TAG }}.tar.gz

  build-tauri-installers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri installers
        run: npm run tauri:build

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: tauri-bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-release-bundle
      - build-tauri-installers
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release-artifacts

      - name: Validate core artifacts
        run: |
          test -f "release-artifacts/web-release-bundle/video-forge-${RELEASE_TAG}.zip"
          test -f "release-artifacts/web-release-bundle/video-forge-${RELEASE_TAG}.tar.gz"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-artifacts/web-release-bundle/video-forge-${{ env.RELEASE_TAG }}.zip
            release-artifacts/web-release-bundle/video-forge-${{ env.RELEASE_TAG }}.tar.gz
            release-artifacts/tauri-bundles-windows-latest/**/*.msi
            release-artifacts/tauri-bundles-windows-latest/**/*.exe
            release-artifacts/tauri-bundles-macos-latest/**/*.dmg
            release-artifacts/tauri-bundles-macos-latest/**/*.app.tar.gz
            release-artifacts/tauri-bundles-ubuntu-latest/**/*.AppImage
            release-artifacts/tauri-bundles-ubuntu-latest/**/*.deb
